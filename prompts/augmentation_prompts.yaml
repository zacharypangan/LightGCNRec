      Output the genres as a python list without any additional text or explanations.
      Based on the user's persona: $persona, their previously rated genres: $genres, and the games they've played: $played_games, recommend 5 new game genres from the provided list.

  - name: steam_item_proximal_category_identification
    dataset: steam
    source_table: 13
