    template: |
      You are a person looking for a game to play by judging their game cover art.
      You analyze and concisely describe the contents of a given game cover.
      Provide a concise 3-sentence description focusing on the main visual elements, colors, style, and mood of the cover and the overall theme or genre inferred from the design elements.

  - name: steam_user_proximal_category_identification
    dataset: steam
    source_table: 13
    process: "Proximal Category Identification (User)"
    output: "C_hat_e (User Proximal Categories)"
