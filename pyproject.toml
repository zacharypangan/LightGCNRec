[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lightgcnrec"
version = "0.1.0"
description = "LLM-guided semantic and topological augmentation for diversified LightGCN recommendation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Zachary S. Pangan" },
  { name = "Shaowen Peng" },
  { name = "Shoko Wakamiya" },
  { name = "Eiji Aramaki" }
]
keywords = ["recommender-systems", "LightGCN", "graph-neural-networks", "LLM", "diversity"]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "tqdm>=4.66"
]

[project.optional-dependencies]
train = [
  "torch>=2.1",
  "torch-geometric>=2.4",
  "torch-sparse>=0.6"
]
llm = [
  "langchain-community>=0.2",
  "ollama>=0.3",
  "transformers>=4.40",
  "Pillow>=10.0",
  "torchvision>=0.16"
]
viz = [
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "umap-learn>=0.5"
]
dev = [
  "pytest>=8.0",
  "nbformat>=5.9"
]

[project.urls]
Paper = "https://doi.org/10.1109/ACCESS.2025.3637140"

[tool.setuptools.packages.find]
include = ["lightgcnrec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
