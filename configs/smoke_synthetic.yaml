experiment:
  name: smoke_synthetic
dataset:
  name: synthetic
  synthetic: true
model:
  name: lightgcn
  embedding_dim: 8
  num_layers: 1
augmentation:
  mode: none
training:
  seed: 42
  device: cpu
  epochs: 1
  batch_size: 4
  lr: 0.01
  lambda_reg: 0.0001
  val_ratio: 0.1
  test_ratio: 0.1
evaluation:
  k: 20
output:
  dir: outputs/smoke_synthetic
